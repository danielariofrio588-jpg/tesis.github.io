<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicar obra - EcuaArte Vivo</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<header>
    <h1>EcuaArte Vivo</h1>
    <nav>
        <a href="index.html">Inicio</a>

        <a href="mis-obras.html"> Mis obras</a>

        <span id="zona-usuario"></span>

    </nav>

</header>


<main>

    <section class="contenedor-formulario">

        <h2>Publicar nueva obra</h2>


        <form id="form-publicar">
            <label for="titulo">Título</label>

            <input type="text" id="titulo" required>

            <label for="autor">Autor</label>
            <input type="text" id="autor" required>
            <label for="tecnica"> Técnica </label>
            <input type="text"id="tecnica"required >
            <label for="anio">Año</label>
            <input type="number"id="anio" min="1"max="2100"required>
            <label for="descripcion">Descripción </label>
            <textarea id="descripcion"rows="5"></textarea>

            <label for="imagen">Imagen de la obra </label>
            <input type="file"id="imagen"accept="image/*"required>
            <button type="submit">Publicar obra </button>
        </form>
    </section>

</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/navegacion.js"></script>
<script src="js/publicar.js"></script>

</body>

</html>
